{ const n = 900, g = new THREE.BufferGeometry(), P = new Float32Array(n * 3); let k = 0; const put = (x, y, z) => { if (k < n) P.set([x, y, z], 3 * k++); }; for (let x = -M.BW; x <= M.BW; x += .1) { put(x, 0, -M.BZ); put(x, 0, M.BZ); put(x, M.TOP, M.BZ); } for (let y = 0; y <= M.TOP; y += .1) { put(-M.BW, y, M.BZ); put(M.BW, y, M.BZ); }
